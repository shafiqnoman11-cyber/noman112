js = r'''const products = [
  {id:1,name:"Zinger Burger",cat:"Burger",price:550,icon:"🍔",desc:"Crispy chicken, cheese & special sauce"},
  {id:2,name:"AK Beef Burger",cat:"Burger",price:650,icon:"🍔",desc:"Juicy beef patty, cheese & fresh salad"},
  {id:3,name:"Chicken Pizza",cat:"Pizza",price:900,icon:"🍕",desc:"Chicken, mozzarella & signature sauce"},
  {id:4,name:"Pepperoni Pizza",cat:"Pizza",price:1050,icon:"🍕",desc:"Pepperoni, mozzarella & herbs"},
  {id:5,name:"French Fries",cat:"Fries",price:250,icon:"🍟",desc:"Crispy golden fries with seasoning"},
  {id:6,name:"Loaded Fries",cat:"Fries",price:420,icon:"🍟",desc:"Fries topped with cheese & chicken"},
  {id:7,name:"Cold Drink",cat:"Drink",price:150,icon:"🥤",desc:"Ice-cold refreshing soft drink"},
  {id:8,name:"Chocolate Shake",cat:"Drink",price:350,icon:"🥤",desc:"Rich creamy chocolate shake"}
];

let cart = JSON.parse(localStorage.getItem("akCart") || "[]");
const productsEl=document.getElementById("products"), cartCount=document.getElementById("cartCount");
const cartPanel=document.getElementById("cartPanel"), overlay=document.getElementById("overlay");
const cartItems=document.getElementById("cartItems"), cartTotal=document.getElementById("cartTotal"), toast=document.getElementById("toast");

function money(n){return "Rs. " + n.toLocaleString("en-PK")}
function renderProducts(filter="All"){
  productsEl.innerHTML=products.filter(p=>filter==="All"||p.cat===filter).map(p=>`
    <article class="product">
      <div class="product-img">${p.icon}</div>
      <div class="product-body">
        <h3>${p.name}</h3><p>${p.desc}</p>
        <span class="price">${money(p.price)}</span>
        <button class="add" onclick="addToCart(${p.id})">+</button>
      </div>
    </article>`).join("");
}
function addToCart(id){
  const item=cart.find(x=>x.id===id);
  if(item)item.qty++;
  else cart.push({id,qty:1});
  save(); showToast("Added to cart ✓");
}
function changeQty(id,delta){
  const item=cart.find(x=>x.id===id);
  if(!item)return;
  item.qty+=delta;
  if(item.qty<=0)cart=cart.filter(x=>x.id!==id);
  save();
}
function save(){localStorage.setItem("akCart",JSON.stringify(cart));renderCart()}
function renderCart(){
  const count=cart.reduce((s,x)=>s+x.qty,0);
  cartCount.textContent=count;
  if(!cart.length){cartItems.innerHTML='<p class="empty">Your cart is empty.</p>';cartTotal.textContent="Rs. 0";return}
  let total=0;
  cartItems.innerHTML=cart.map(x=>{
    const p=products.find(p=>p.id===x.id), sub=p.price*x.qty; total+=sub;
    return `<div class="cart-row"><div><b>${p.name}</b><small>${money(p.price)} each</small></div>
      <div class="qty"><button onclick="changeQty(${p.id},-1)">−</button><span>${x.qty}</span><button onclick="changeQty(${p.id},1)">+</button></div></div>`;
  }).join("");
  cartTotal.textContent=money(total);
}
function openCart(){cartPanel.classList.add("open");overlay.classList.add("show")}
function closeCart(){cartPanel.classList.remove("open");overlay.classList.remove("show")}
function showToast(msg){toast.textContent=msg;toast.classList.add("show");setTimeout(()=>toast.classList.remove("show"),1800)}

document.querySelectorAll(".filter").forEach(btn=>btn.addEventListener("click",()=>{
  document.querySelectorAll(".filter").forEach(b=>b.classList.remove("active"));btn.classList.add("active");renderProducts(btn.dataset.filter);
}));
document.querySelectorAll(".categories a").forEach(a=>a.addEventListener("click",()=>{
  const f=a.dataset.filter;
  document.querySelectorAll(".filter").forEach(b=>b.classList.toggle("active",b.dataset.filter===f));
  setTimeout(()=>renderProducts(f),0);
}));
document.getElementById("cartBtn").onclick=openCart;
document.getElementById("closeCart").onclick=closeCart;
overlay.onclick=closeCart;
document.getElementById("checkout").onclick=()=>{
  if(!cart.length){showToast("Your cart is empty");return}
  showToast("Order ready! Connect your payment/WhatsApp here.");
};
document.querySelector(".menu-toggle").onclick=()=>document.querySelector(".nav").classList.toggle("open");
document.querySelectorAll(".nav a").forEach(a=>a.onclick=()=>document.querySelector(".nav").classList.remove("open"));

renderProducts();renderCart();
'''
